esphome:
  name: esp-garage-door
  friendly_name: Garage Door
  comment: Genie garage door controller via transistor-triggered spare remote

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "GarageDoor-Fallback"
    password: !secret fallback_ap_password
  on_connect:
    - switch.turn_on: wifi_status_led
  on_disconnect:
    - switch.turn_off: wifi_status_led

captive_portal:

# GPIO driving the 2N3904 base via 1 kΩ resistor.
# When GPIO33 goes HIGH, transistor saturates and shorts the
# remote's door-button input pad to ground → simulated button press.
switch:
  # GPIO33 drives the 2N3904 base via 1 kΩ resistor.
  # When HIGH, transistor saturates and shorts the remote's door-button
  # input pad to ground → simulated button press.
  - platform: gpio
    pin: GPIO33
    id: door_trigger
    restore_mode: ALWAYS_OFF
    internal: true
  # GPIO2 — onboard blue LED. Toggle inverted if polarity is wrong.
  # Active-low (most boards): inverted: true
  # Active-high: inverted: false
  - platform: gpio
    pin:
      number: GPIO2
      inverted: false
    id: wifi_status_led
    name: "WiFi Status LED"
    internal: true
    restore_mode: ALWAYS_OFF

# Expected HC-SR04 distance reading when door is OPEN (top panel horizontal
# near the ceiling/powerhead). Set in HA after measuring with door open.
# Door CLOSED: panel out of range → sensor returns NaN → cover reports CLOSED.
# Cover returns OPEN only if reading is within ±0.1 m of this value.
number:
  - platform: template
    name: "Door Open Distance"
    id: door_open_distance
    min_value: 0.1
    max_value: 3.0
    step: 0.01
    initial_value: 0.54
    optimistic: true
    restore_value: true
    unit_of_measurement: "m"

# Genie wall-button logic: one momentary press cycles the door
# (open if closed, close if open, stop if moving). All three cover
# actions pulse the same transistor for ~300 ms. Cover state:
#   - Distance ≈ door_open_distance (±0.1 m) → OPEN
#   - Anything else (including NaN / out-of-range) → CLOSED
cover:
  - platform: template
    name: "Garage Door"
    id: garage_door
    device_class: garage
    lambda: |-
      if (isnan(id(garage_distance).state)) {
        return COVER_CLOSED;
      }
      if (fabs(id(garage_distance).state - id(door_open_distance).state) <= 0.1) {
        return COVER_OPEN;
      }
      return COVER_CLOSED;
    open_action:
      - switch.turn_on: door_trigger
      - delay: 300ms
      - switch.turn_off: door_trigger
    close_action:
      - switch.turn_on: door_trigger
      - delay: 300ms
      - switch.turn_off: door_trigger
    stop_action:
      - switch.turn_on: door_trigger
      - delay: 300ms
      - switch.turn_off: door_trigger

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
  # HC-SR04 ultrasonic distance sensor pointing down at top door panel.
  # NOTE: ECHO outputs 5V — must use a 2kΩ/1kΩ voltage divider to GPIO22,
  # or use an HC-SR04P (3V variant) with no divider.
  - platform: ultrasonic
    trigger_pin: GPIO23
    echo_pin: GPIO22
    name: "Garage Door Distance"
    id: garage_distance
    update_interval: 1s
    timeout: 2.5m
    accuracy_decimals: 2
    unit_of_measurement: "m"
    filters:
      - median:
          window_size: 5
          send_every: 5

text_sensor:
  - platform: version
    name: "ESPHome Version"

button:
  - platform: restart
    name: "Restart"
