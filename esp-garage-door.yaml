esphome:
  name: esp-garage-door
  friendly_name: Garage Door
  comment: Genie garage door controller via transistor-triggered spare remote

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG
  logs:
    # Mute the ultrasonic distance-reading spam from BOTH HC-SR04s (2 Hz total)
    # so the cover / toggle events are visible in the stream.
    sensor.ultrasonic: WARN

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "GarageDoor-Fallback"
    password: !secret fallback_ap_password
  on_connect:
    - switch.turn_on: wifi_status_led
  on_disconnect:
    - switch.turn_off: wifi_status_led

captive_portal:

# ──────────────────────────────────────────────────────────────────────────
# Door state is now read DIRECTLY from a second HC-SR04 ultrasonic sensor
# aimed at the door panel. When the door is OPEN the panel sits in the beam
# at ~1 m; when CLOSED the beam clears the panel and returns no echo (NaN).
# This replaces the previous LDR/bulb-derived state tracking, which drifted
# (single bulb-on signal can't tell open from close, and a physical-remote
# press during the bulb-on window was invisible). The ultrasonic reads actual
# position, so the cover reports truth instead of an assumption.
#
# The LDR/light sensor is retained as a plain "bulb lit" binary for HA — but
# with all door-state derivation and debouncing removed (see binary_sensor
# garage_light_sensor below).
# ──────────────────────────────────────────────────────────────────────────

binary_sensor:
  # Light sensor stripped down to a basic "opener bulb lit" binary for HA.
  # ADC on GPIO32 (ADC1_CH4), 47 kΩ external pull-up to 3.3 V (internal
  # pull-ups are silently bypassed for ADC pins — see sensor block below).
  # ON = lit (ADC voltage below the threshold), OFF = dark. No state
  # derivation, no toggling, no debouncing — just the raw lit/dark signal.
  - platform: template
    id: garage_light_sensor
    name: "Garage Door Light Sensor"
    device_class: light
    lambda: |-
      if (isnan(id(garage_light_adc).state)) {
        return false;
      }
      return id(garage_light_adc).state < id(light_threshold_volts).state;

  # Car-presence derived from the parking-spot ultrasonic sensor.
  - platform: template
    name: "Car In Garage"
    id: car_in_garage
    device_class: presence
    lambda: |-
      if (isnan(id(parking_distance).state)) {
        return false;
      }
      return id(parking_distance).state <= id(car_present_distance).state;

# GPIO driving the 2N3904 base via 1 kΩ resistor.
# When GPIO33 goes HIGH, transistor saturates and shorts the
# remote's door-button input pad to ground → simulated button press.
switch:
  # GPIO33 drives the 2N3904 base via 1 kΩ resistor. When HIGH, transistor
  # saturates and shorts the remote's door-button pad to ground → button press.
  # No state logic here — door_trigger is just the electrical pulse path. The
  # Genie remote is a single toggle, so open/close/stop all pulse the same pin;
  # cover state comes from the door ultrasonic sensor, not from this switch.
  - platform: gpio
    pin: GPIO33
    id: door_trigger
    restore_mode: ALWAYS_OFF
    internal: true
  # GPIO2 — onboard blue LED. Active-high on this board (flip inverted if not).
  - platform: gpio
    pin:
      number: GPIO2
      inverted: false
    id: wifi_status_led
    name: "WiFi Status LED"
    internal: true
    restore_mode: ALWAYS_OFF

# Tunable thresholds.
number:
  # Distance cutoff for the DOOR ultrasonic. The door is considered OPEN when
  # the reading is a valid number at or below this (panel in beam at ~1 m);
  # NaN (no echo, door closed) = CLOSED. Default 1.5 m gives margin above the
  # ~1 m open reading — measure your actual open distance and trim this so it
  # reliably covers the open reading without catching the closed (NaN) case.
  - platform: template
    name: "Door Open Distance"
    id: door_open_distance
    min_value: 0.2
    max_value: 3.0
    step: 0.05
    initial_value: 1.5
    optimistic: true
    restore_value: true
    unit_of_measurement: "m"
  # Distance threshold below which a car is considered parked under the
  # parking-spot ultrasonic sensor. Tune in HA after measuring with car parked.
  - platform: template
    name: "Car Present Distance"
    id: car_present_distance
    min_value: 0.1
    max_value: 3.0
    step: 0.01
    initial_value: 1.2
    optimistic: true
    restore_value: true
    unit_of_measurement: "m"
  # Voltage threshold for the light sensor. ADC reading BELOW this = "lit".
  # Tune after install: dark → note ADC reading; shine light → note reading;
  # set threshold between them.
  - platform: template
    name: "Light Threshold Volts"
    id: light_threshold_volts
    min_value: 0.1
    max_value: 3.2
    step: 0.05
    initial_value: 1.5
    optimistic: true
    restore_value: true
    unit_of_measurement: "V"

# Genie wall-button logic: one momentary press cycles the door (toggle).
# All three cover actions pulse the same transistor for ~300 ms. State is NOT
# assumed on command — the cover lambda reads the door ultrasonic, so HA
# reports actual position once the panel settles at the open/closed spot.
cover:
  - platform: template
    name: "Garage Door"
    id: garage_door
    device_class: garage
    lambda: |-
      // OPEN when the door ultrasonic sees the panel in its beam (valid
      // reading within the open-distance cutoff). NaN or out-of-range = CLOSED.
      if (!isnan(id(door_distance).state) &&
          id(door_distance).state <= id(door_open_distance).state) {
        return COVER_OPEN;
      }
      return COVER_CLOSED;
    open_action:
      - switch.turn_on: door_trigger
      - delay: 300ms
      - switch.turn_off: door_trigger
    close_action:
      - switch.turn_on: door_trigger
      - delay: 300ms
      - switch.turn_off: door_trigger
    stop_action:
      - switch.turn_on: door_trigger
      - delay: 300ms
      - switch.turn_off: door_trigger

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
  # Photodiode / LDR voltage on GPIO32 (ADC1_CH4).
  # NOTE: ESP32 internal pull-ups DO NOT WORK for pins in ADC mode — the
  # pull-up hardware is part of the digital GPIO subsystem and is bypassed
  # when the pin switches to the RTC/analog subsystem for ADC reads.
  # `pullup: true` in the pin config is silently ignored for ADC pins.
  # A physical external pull-up resistor is REQUIRED.
  #
  # Wiring:
  #   3.3V ──[ 47 kΩ ]──┬── GPIO32 (ADC reads here)
  #                     │
  #                     └── sensor ── GND
  #
  # 47 kΩ gives good separation for LDRs and most photodiodes. For very
  # low-photocurrent sensors, try 100 kΩ–220 kΩ (more sensitive, noisier).
  - platform: adc
    pin: GPIO32
    name: "Garage Door Light ADC"
    id: garage_light_adc
    attenuation: auto
    update_interval: 500ms
    accuracy_decimals: 2
    unit_of_measurement: "V"
    filters:
      - median:
          window_size: 5
          send_every: 2
  # HC-SR04 #1 — points DOWN at the parking spot → car presence.
  # ECHO outputs 5 V: use a 2 kΩ/1 kΩ voltage divider to GPIO22 (or an
  # HC-SR04P 3 V variant with no divider).
  - platform: ultrasonic
    trigger_pin: GPIO23
    echo_pin: GPIO22
    name: "Parking Distance"
    id: parking_distance
    update_interval: 1s
    timeout: 2.5m
    accuracy_decimals: 2
    unit_of_measurement: "m"
    filters:
      - median:
          window_size: 5
          send_every: 5
  # HC-SR04 #2 — aimed at the DOOR panel → door open/closed state.
  # Same wiring as #1 (2 kΩ/1 kΩ divider on ECHO to GPIO26). OPEN ≈ a valid
  # reading at ~1 m (panel in beam); CLOSED = no echo (NaN). The cover lambda
  # and door_open_distance number above turn this into cover state.
  # NOTE: relocated from GPIO21/19 → GPIO25/26. The door position timed out on
  # 21/19 with two known-good modules (both work at the parking spot on 22/23),
  # so the fault is in the 21/19 path or that harness; the new pins isolate it.
  - platform: ultrasonic
    trigger_pin: GPIO25
    echo_pin: GPIO26
    name: "Door Distance"
    id: door_distance
    update_interval: 1s
    timeout: 2m
    accuracy_decimals: 2
    unit_of_measurement: "m"
    filters:
      - median:
          window_size: 5
          send_every: 3

text_sensor:
  - platform: version
    name: "ESPHome Version"

button:
  - platform: restart
    name: "Restart"
