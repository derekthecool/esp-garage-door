esphome:
  name: esp-garage-door
  friendly_name: Garage Door
  comment: Genie garage door controller via transistor-triggered spare remote

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "GarageDoor-Fallback"
    password: !secret fallback_ap_password

captive_portal:

# GPIO driving the 2N3904 base via 1 kΩ resistor.
# When GPIO33 goes HIGH, transistor saturates and shorts the
# remote's door-button input pad to ground → simulated button press.
switch:
  - platform: gpio
    pin: GPIO33
    id: door_trigger
    restore_mode: ALWAYS_OFF
    internal: true

# Tunable threshold — set via HA UI. Distance below this = door OPEN.
# Mount HC-SR04 on top of the powerhead pointing down at the top door panel.
# Door OPEN: panel horizontal near ceiling → small distance.
# Door CLOSED: panel vertical at front of opening → large distance.
number:
  - platform: template
    name: "Door Distance Threshold"
    id: door_distance_threshold
    min_value: 0.1
    max_value: 3.0
    step: 0.05
    initial_value: 1.0
    optimistic: true
    restore_value: true
    unit_of_measurement: "m"

# Genie wall-button logic: one momentary press cycles the door
# (open if closed, close if open, stop if moving). All three cover
# actions pulse the same transistor for ~300 ms. Cover state is
# derived from the HC-SR04 distance reading vs. the threshold above.
cover:
  - platform: template
    name: "Garage Door"
    id: garage_door
    device_class: garage
    lambda: |-
      if (isnan(id(garage_distance).state)) {
        return {};
      }
      if (id(garage_distance).state < id(door_distance_threshold).state) {
        return COVER_OPEN;
      } else {
        return COVER_CLOSED;
      }
    open_action:
      - switch.turn_on: door_trigger
      - delay: 300ms
      - switch.turn_off: door_trigger
    close_action:
      - switch.turn_on: door_trigger
      - delay: 300ms
      - switch.turn_off: door_trigger
    stop_action:
      - switch.turn_on: door_trigger
      - delay: 300ms
      - switch.turn_off: door_trigger

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
  # HC-SR04 ultrasonic distance sensor pointing down at top door panel.
  # NOTE: ECHO outputs 5V — must use a 2kΩ/1kΩ voltage divider to GPIO22,
  # or use an HC-SR04P (3V variant) with no divider.
  - platform: ultrasonic
    trigger_pin: GPIO23
    echo_pin: GPIO22
    name: "Garage Door Distance"
    id: garage_distance
    update_interval: 1s
    timeout: 2.5m
    accuracy_decimals: 2
    unit_of_measurement: "m"
    filters:
      - median:
          window_size: 5
          send_every: 5

text_sensor:
  - platform: version
    name: "ESPHome Version"

button:
  - platform: restart
    name: "Restart"
