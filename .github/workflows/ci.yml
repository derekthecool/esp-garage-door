name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Validate and Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-esphome
          restore-keys: ${{ runner.os }}-pip-

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('esp-garage-door.yaml') }}
          restore-keys: ${{ runner.os }}-platformio-

      - name: Install ESPHome
        run: pip install esphome

      # CI never connects to anything, so generate fresh throwaway secrets.
      # They just need to be structurally valid (right length / encoding).
      - name: Generate CI secrets
        run: |
          cat > secrets.yaml <<EOF
          wifi_ssid: "ci-test-network"
          wifi_password: "ci-test-password"
          api_encryption_key: "$(openssl rand -base64 32)"
          ota_password: "$(openssl rand -hex 16)"
          fallback_ap_password: "ci-fallback-password"
          EOF

      - name: Validate config
        run: esphome config esp-garage-door.yaml

      - name: Compile firmware
        run: esphome compile esp-garage-door.yaml
